# Catppuccin Mocha. Inlined: this used to source ~/.config/hypr/mocha.conf,
# which does not exist, leaving every colour below undefined.
$text = rgb(cdd6f4)
$surface0 = rgb(313244)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$yellow = rgb(f9e2af)

$accent = $mauve
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
# No monitor = every output. Pinning these to DP-1/2/3 left any other screen
# (a laptop's eDP-1) locked to an unpainted surface.
background {
  monitor =
  path = screenshot
  color = rgba(25, 20, 20, 1.0)
  blur_passes = 4
  blur_size = 10
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# FINGERPRINT
label {
  monitor =
  text = $FPRINTPROMPT
  color = $text
  font_size = 14
  font_family = $font
  position = 0, -107
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <i>󰌾 </i>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
